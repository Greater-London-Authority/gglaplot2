# The pull request check: the check set in check.yml and a build of the
# site. main itself only moves by the promotion in promote-dev.yml, which
# runs the same set first, so there is no push trigger for main here. A new
# push to the same pull request cancels the run in progress.
name: R-CMD-check
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
# the site job is the pkgdown workflow called with publishing off; a called
# workflow may not ask for more than its caller grants, so the Pages
# permissions are granted here and go unused
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    uses: ./.github/workflows/check.yml
  site:
    uses: ./.github/workflows/pkgdown.yml
    with:
      publish: false
