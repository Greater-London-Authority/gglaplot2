# Keeps main as the released copy of the package. Work lands on dev through
# pull requests; every push to dev runs the full check set and a build of
# the site, and only a green run moves main forward to it. A red run leaves
# main where it was, so anyone installing from main gets a package that
# passed on every platform in the matrix.
#
# The move is a fast-forward and nothing else. If main has been pushed to
# directly and no longer sits behind dev, the job fails rather than forcing,
# and the fix is to merge main into dev and push again.
#
# The site is published here too, after the move. A push made by a workflow
# with the built-in token does not start other workflows, so the push to
# main cannot trigger the site workflow on its own. The site job builds it
# once and keeps it as the run's Pages artifact; the publish job deploys
# that same artifact rather than building again, which would leave two
# artifacts of the same name in the run and the deployment refusing to
# choose between them.
name: Promote dev to main
on:
  push:
    branches: [dev]
  workflow_dispatch:
# the site job is the pkgdown workflow called with publishing off, and a
# called workflow may not ask for more than its caller grants; the Pages
# permissions are for the publish job
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: promote-dev
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
  site:
    uses: ./.github/workflows/pkgdown.yml
    with:
      publish: false

  promote:
    name: Fast-forward main
    needs: [check, site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history, so main's position can be checked against dev
          fetch-depth: 0

      - name: Fast-forward main to dev
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main is not behind dev, so it cannot be fast-forwarded. Merge main into dev and push again."
            exit 1
          fi
          git push origin HEAD:main

  publish:
    name: Publish to Pages
    needs: promote
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
