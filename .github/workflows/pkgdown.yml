# The documentation site. A push to main builds it and publishes it to
# GitHub Pages, the way the visualisation team's Storybook is published.
# Called from the pull request check and the promotion with publish off, it
# builds the site and keeps the result as an artifact, so a broken article
# fails the check before it lands and never reaches main.
name: pkgdown
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      publish:
        description: Publish the built site to Pages
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event_name == 'push' && 'publish' || github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish to Pages
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
